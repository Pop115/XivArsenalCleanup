# Keeps the two things this repository pins from quietly rotting: the actions the workflows call,
# and the NuGet packages the test project uses. Monthly rather than weekly — this is a small project
# and a pull request nobody has time to read is worse than a slightly older dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: nuget
    directory: /ArsenalCleanup
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build'
    groups:
      # The test stack moves together; three separate pull requests for it would be noise.
      test-stack:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'coverlet.*'
